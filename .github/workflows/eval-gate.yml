name: Eval Gate

# docs/results/history.json is the checked-in baseline for the gate. It is
# currently promoted manually (e.g. by re-running the Task 11 procedure and
# committing the updated file) rather than auto-updated by CI. This is an
# intentional scope boundary: an automated workflow silently pushing new
# baselines back to the branch would be a deliberate design decision, not a
# bug-fix-pass change.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  eval:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync workspace
        run: uv sync

      - name: Run eval gate
        run: |
          uv run harness gate \
            --testcases-dir testcases \
            --history-path docs/results/history.json \
            --report-out report.html \
            --commit-sha "${{ github.sha }}"

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            report.html
            docs/results/history.json
