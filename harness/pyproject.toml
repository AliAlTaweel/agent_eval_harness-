[project]
name = "harness"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "trace-schema",
    "pydantic>=2.6",
    "jinja2>=3.1",
    "click>=8.1",
    "ollama>=0.3",
]

[tool.uv.sources]
trace-schema = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[project.scripts]
harness = "harness.cli:cli"
